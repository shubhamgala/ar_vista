# Gradle JVM arguments - increased for large projects
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dkotlin.daemon.jvm.options=-Xmx2048m

# Android X and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Gradle daemon for faster builds
org.gradle.daemon=true

# Parallel execution
org.gradle.parallel=true